version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # 3.0.0 is a tombstone release (compile_error only) left by the
      # maintainer after being doxxed/harassed off the project; staying
      # on 1.3.x.
      - dependency-name: "bincode"
        versions: [">=2.0.0"]
      # egui/eframe/egui_extras must be upgraded together; egui_extras
      # alone at 0.34 breaks against egui/eframe still pinned at 0.29.
      - dependency-name: "egui"
        versions: [">=0.30.0"]
      - dependency-name: "eframe"
        versions: [">=0.30.0"]
      - dependency-name: "egui_extras"
        versions: [">=0.30.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
